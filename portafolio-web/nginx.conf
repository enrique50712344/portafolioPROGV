# nginx — portafolio local (:8083)
# Estáticos del build React + proxies a las apps del mismo equipo.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- assets con caché inmutable (hash en el nombre) ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- sondas de estado (semáforos del portafolio) ---
    location /probe/inventario/ { proxy_pass http://host.docker.internal:8080/gestion-inventario/; }
    location /probe/rrhh/       { proxy_pass http://host.docker.internal:8081/rrhh/; }
    location /probe/reservas/   { proxy_pass http://host.docker.internal:8082/; }
    location /probe/prototipo/  { proxy_pass http://host.docker.internal:3000/; }

    # --- consola de APIs en vivo (mismo origen, sin CORS) ---
    location /api-live/reservas/  { proxy_pass http://host.docker.internal:8082/; }
    location /api-live/prototipo/ { proxy_pass http://host.docker.internal:3000/; }

    # --- timeouts cortos: que el semáforo reaccione rápido ---
    proxy_connect_timeout 3s;
    proxy_read_timeout    7s;

    # --- SPA ---
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
